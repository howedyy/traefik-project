networks:
  web:
    name: web
    driver: bridge
  backend:
    name: backend
    driver: bridge

services:
  traefik:
    image: traefik:v2.11
    container_name: traefik
    command:
      - "--api.insecure=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
    networks:
      - web

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    volumes:
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend

  redis:
    image: redis:7-alpine
    container_name: redis
    networks:
      - backend

  frontend:
    build: ./frontend
    container_name: frontend
    networks:
      - web
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.entrypoints=web"
      - "traefik.http.services.frontend.loadbalancer.server.port=3000"
      - "traefik.http.routers.frontend.priority=1"

  user-service:
    build: ./user-service
    container_name: user-service
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/users_db
    networks:
      - web
      - backend
    depends_on:
      - postgres
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.user-service.rule=PathPrefix(`/api/users`)"
      - "traefik.http.routers.user-service.entrypoints=web"
      - "traefik.http.routers.user-service.middlewares=user-strip"
      - "traefik.http.middlewares.user-strip.stripprefix.prefixes=/api/users"
      - "traefik.http.services.user-service.loadbalancer.server.port=5000"
      - "traefik.http.routers.user-service.priority=10"

  product-service:
    build: ./product-service
    container_name: product-service
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/products_db
    networks:
      - web
      - backend
    depends_on:
      - postgres
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.product-service.rule=PathPrefix(`/api/products`)"
      - "traefik.http.routers.product-service.entrypoints=web"
      - "traefik.http.routers.product-service.middlewares=product-strip"
      - "traefik.http.middlewares.product-strip.stripprefix.prefixes=/api/products"
      - "traefik.http.services.product-service.loadbalancer.server.port=5001"
      - "traefik.http.routers.product-service.priority=10"

  order-service:
    build: ./order-service
    container_name: order-service
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/orders_db
      REDIS_URL: redis://redis:6379/0
      USER_SERVICE_URL: http://user-service:5000
      PRODUCT_SERVICE_URL: http://product-service:5001
    networks:
      - web
      - backend
    depends_on:
      - postgres
      - redis
      - user-service
      - product-service
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=web"
      - "traefik.http.routers.order-service.rule=PathPrefix(`/api/orders`)"
      - "traefik.http.routers.order-service.entrypoints=web"
      - "traefik.http.routers.order-service.middlewares=order-strip"
      - "traefik.http.middlewares.order-strip.stripprefix.prefixes=/api/orders"
      - "traefik.http.services.order-service.loadbalancer.server.port=5002"
      - "traefik.http.routers.order-service.priority=10"

volumes:
  postgres_data:
